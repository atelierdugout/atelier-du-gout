<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic Netlify</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f4ec;color:#33402c;margin:0}
main{max-width:760px;margin:10vh auto;padding:30px}.card{background:white;border-radius:18px;padding:28px}
pre{white-space:pre-wrap;background:#f2f2f2;padding:16px;border-radius:10px}
</style></head>
<body><main><div class="card">
<h1>Diagnostic Netlify</h1>
<p>Cette page n’affiche aucune valeur secrète. Elle vérifie uniquement si la Function voit la variable Mollie et sous quel nom.</p>
<pre id="out">Vérification…</pre>
</div></main>
<script>
fetch('/.netlify/functions/check-env')
 .then(async r => ({ok:r.ok,data:await r.json()}))
 .then(x => document.getElementById('out').textContent=JSON.stringify(x.data,null,2))
 .catch(e => document.getElementById('out').textContent='Erreur : '+e.message);
</script>
</body></html>
