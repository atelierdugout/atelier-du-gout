<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion boutique · L’Atelier du Goût</title><link rel="stylesheet" href="/assets/style.css"><style>
.admin{max-width:1120px;margin:0 auto;padding:28px 18px 70px}.box{background:#fff;border:1px solid #ded9cc;border-radius:16px;padding:20px;margin:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin input,.admin select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfc9ba;border-radius:9px;font:inherit}.admin button{background:#33402c;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.muted{opacity:.7}.err{color:#9b2c2c}.ok{color:#33402c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.secondary{background:#f2efe7;color:#33402c}.orders{display:grid;gap:14px}.order{border:1px solid #ded9cc;border-radius:14px;padding:16px;background:#fff}.orderhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2efe7;font-size:12px;font-weight:700}.money{font-family:Georgia,serif;font-size:23px}.items{margin:12px 0;padding-left:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}.bigbalance{font-size:34px;font-family:Georgia,serif;margin:5px 0 18px}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:10px 7px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.row{grid-template-columns:1fr}.history{font-size:13px}.orderhead{display:block}.money{margin-top:8px}}
</style></head><body><section class="pagehead"><div class="kicker">Gestion boutique</div><h1>Tableau de bord</h1><p>Commandes, retraits, livraisons et cartes cadeaux.</p></section><main class="admin">
<div class="box"><div class="row"><label>Code administrateur<input id="pin" type="password" autocomplete="current-password"></label><div><label>&nbsp;</label><button id="load">Ouvrir la gestion</button></div></div><div id="authmsg"></div></div>
<section id="dashboard" hidden><div class="box"><h2>Commandes</h2><div class="tabs"><button data-scope="upcoming">À préparer</button><button class="secondary" data-scope="today">Aujourd’hui</button><button class="secondary" data-scope="all">Historique</button><select id="mode" style="max-width:190px"><option value="all">Retrait + livraison</option><option value="pickup">Retrait</option><option value="delivery">Livraison</option></select></div><div id="ordersmsg" class="muted"></div><div id="orders" class="orders"></div></div>
<div class="box"><h2>Cartes cadeaux</h2><div class="row"><label>Code carte cadeau<input id="code" autocomplete="off" placeholder="ADG-…"></label><div><label>&nbsp;</label><button id="search">Rechercher la carte</button></div></div><div id="msg"></div><div id="giftresult" hidden><div class="muted">Solde disponible</div><div id="balance" class="bigbalance"></div><div id="details"></div><hr><h3>Débiter en boutique</h3><div class="row"><label>Montant (€)<input id="amount" inputmode="decimal" placeholder="10,00"></label><label>Note<input id="note" placeholder="Achat boutique"></label></div><p><button id="redeem">Valider le débit</button></p><div id="redeemMsg"></div><h3>Historique</h3><div style="overflow:auto"><table class="history"><thead><tr><th>Date</th><th>Opération</th><th>Montant</th><th>Référence / note</th></tr></thead><tbody id="history"></tbody></table></div></div></div></section>
</main><script>
const $=id=>document.getElementById(id), euro=c=>(Number(c||0)/100).toFixed(2).replace('.',',')+' €';let scope='upcoming';
const statusLabel={new:'Nouvelle',preparing:'En préparation',ready:'Prête',completed:'Terminée'}, modeLabel={pickup:'Retrait',delivery:'Livraison'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadOrders(){ $('ordersmsg').textContent='Chargement…'; const r=await fetch(`/.netlify/functions/admin-orders?scope=${scope}&mode=${$('mode').value}`,{headers:{'x-admin-pin':$('pin').value}});const j=await r.json();if(!r.ok){$('authmsg').className='err';$('authmsg').textContent=j.error||'Erreur';$('dashboard').hidden=true;return}$('dashboard').hidden=false;$('authmsg').textContent='';$('ordersmsg').textContent=j.orders.length?`${j.orders.length} commande(s)`:'Aucune commande dans cette vue.';$('orders').innerHTML=j.orders.map(o=>`<article class="order"><div class="orderhead"><div><strong>${esc(o.order_ref)}</strong> <span class="badge">${statusLabel[o.fulfillment_status||'new']||esc(o.fulfillment_status||'new')}</span><p><strong>${esc(o.service_date||'Date non définie')} · ${esc(o.service_slot||'Horaire non défini')}</strong><br>${modeLabel[o.mode]||esc(o.mode)}${o.zone?' · '+esc(o.zone):''}</p></div><div class="money">${euro(o.total_cents)}</div></div><p><strong>${esc(o.customer_name||'Client')}</strong> · ${esc(o.customer_phone||'—')}<br>${esc(o.customer_email||'—')}${o.customer_address?'<br>'+esc(o.customer_address):''}</p><ul class="items">${o.items.map(i=>`<li>${i.quantity} × ${esc(i.product_name)} — ${euro(i.line_total_cents)}</li>`).join('')}</ul>${o.allergies?`<p><strong>Allergies :</strong> ${esc(o.allergies)}</p>`:''}${o.comments?`<p><strong>Commentaire :</strong> ${esc(o.comments)}</p>`:''}<p class="muted">Produits ${euro(o.subtotal_cents)} · Livraison ${euro(o.delivery_cents)}${Number(o.gift_card_cents)>0?' · Carte cadeau −'+euro(o.gift_card_cents):''}${Number(o.loyalty_discount_cents)>0?' · Fidélité −'+euro(o.loyalty_discount_cents):''} · Payé Mollie ${euro(o.mollie_due_cents)}</p><div class="actions">${(o.fulfillment_status||'new')==='new'?`<button type="button" class="status-btn" data-order-id="${esc(o.id)}" data-status="preparing">En préparation</button>`:''}${o.fulfillment_status==='preparing'?`<button type="button" class="status-btn" data-order-id="${esc(o.id)}" data-status="ready">Prête</button>`:''}${o.fulfillment_status==='ready'?`<button type="button" class="status-btn" data-order-id="${esc(o.id)}" data-status="completed">Terminée</button>`:''}${o.fulfillment_status==='completed'?'<span class="badge">Commande terminée</span>':''}</div></article>`).join('');}
async function setStatus(id,status,button){
  if(button){button.disabled=true;button.textContent='Enregistrement…'}
  $('ordersmsg').className='muted';$('ordersmsg').textContent='Mise à jour du statut…';
  try{
    const r=await fetch('/.netlify/functions/admin-orders',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({order_id:String(id),status})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Erreur lors du changement de statut.');
    await loadOrders();
  }catch(e){
    $('ordersmsg').className='err';$('ordersmsg').textContent=e.message||'Impossible de modifier le statut.';
    if(button){button.disabled=false;button.textContent=statusLabel[status]||'Réessayer'}
  }
}
$('orders').addEventListener('click',e=>{
  const b=e.target.closest('.status-btn');
  if(!b)return;
  e.preventDefault();
  setStatus(b.dataset.orderId,b.dataset.status,b);
});
$('load').onclick=loadOrders;$('mode').onchange=loadOrders;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary');loadOrders()});
const labels={issued:'Création',redeemed:'Commande en ligne',store_redeemed:'Utilisation en boutique'};
async function lookup(){ $('msg').textContent='Recherche…';$('giftresult').hidden=true;const r=await fetch('/.netlify/functions/admin-gift-card',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({code:$('code').value})});const j=await r.json();if(!r.ok){$('msg').className='err';$('msg').textContent=j.error||'Erreur';return}$('msg').className='ok';$('msg').textContent='Carte trouvée.';$('giftresult').hidden=false;$('balance').textContent=euro(j.card.balance_cents);$('details').innerHTML=`<p><strong>Statut :</strong> ${esc(j.card.status)} · <strong>Montant initial :</strong> ${euro(j.card.initial_cents)} · <strong>Fin du code :</strong> ••••${esc(j.card.code_last4)}</p><p><strong>Acheteur :</strong> ${esc(j.card.buyer_name||'—')} · ${esc(j.card.buyer_email||'—')}<br><strong>Destinataire :</strong> ${esc(j.card.recipient_name||'—')} · ${esc(j.card.recipient_email||'—')}</p>`;$('history').innerHTML=j.history.map(h=>`<tr><td>${new Date(h.created_at).toLocaleString('fr-FR')}</td><td>${labels[h.event_type]||esc(h.event_type)}</td><td>${h.amount_cents>0?'+':''}${euro(h.amount_cents)}</td><td>${esc(h.order_ref||h.note||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Aucun mouvement</td></tr>'}
$('search').onclick=lookup;$('redeem').onclick=async()=>{if(!confirm('Confirmer ce débit sur la carte cadeau ?'))return;const amount=Number($('amount').value.replace(',','.'));$('redeemMsg').textContent='Enregistrement…';const r=await fetch('/.netlify/functions/admin-gift-redeem',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({code:$('code').value,amount,note:$('note').value})});const j=await r.json();if(!r.ok){$('redeemMsg').className='err';$('redeemMsg').textContent=j.error||'Erreur';return}$('redeemMsg').className='ok';$('redeemMsg').textContent='Débit enregistré. Nouveau solde : '+euro(j.balance_cents);$('amount').value='';await lookup()};
</script></body></html>
